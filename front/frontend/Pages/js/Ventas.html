<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let subtotal = 0;
let descuentos = 0;

/* AGREGAR PRODUCTO */

function agregarVenta(nombre,presentacion,precio){

    let tabla =
    document.getElementById("tablaVentas");

    let fila =
    document.createElement("tr");

    fila.innerHTML = `

    <td>

        <strong>${nombre}</strong>

        <br>

        <small class="text-muted">
            ${presentacion}
        </small>

    </td>

    <td>

        <input 
            type="number"
            class="form-control cantidad"
            value="1"
            min="1"
            onchange="actualizarTotales()"
        >

    </td>

    <td>

        <input 
            type="number"
            class="form-control descuento"
            value="0"
            min="0"
            onchange="actualizarTotales()"
        >

    </td>

    <td class="precio">

        ${precio}

    </td>

    <td>

        <button 
            class="btn btn-danger btn-sm"
            onclick="eliminarFila(this)"
        >

            <i class="bi bi-trash"></i>

        </button>

    </td>

    `;

    tabla.appendChild(fila);

    actualizarTotales();

}

/* ELIMINAR */

function eliminarFila(btn){

    btn.closest("tr").remove();

    actualizarTotales();

}

/* ACTUALIZAR */

function actualizarTotales(){

    subtotal = 0;
    descuentos = 0;

    let filas =
    document.querySelectorAll("#tablaVentas tr");

    filas.forEach(fila=>{

        let cantidad =
        parseInt(
            fila.querySelector(".cantidad").value
        );

        let descuento =
        parseInt(
            fila.querySelector(".descuento").value
        );

        let precio =
        parseInt(
            fila.querySelector(".precio").innerText
        );

        subtotal += precio * cantidad;

        descuentos += descuento * cantidad;

    });

    let total =
    subtotal - descuentos;

    document.getElementById("subtotal")
    .innerText = "$" + subtotal.toLocaleString();

    document.getElementById("descuentoTotal")
    .innerText = "$" + descuentos.toLocaleString();

    document.getElementById("totalFinal")
    .innerText = "$" + total.toLocaleString();

}

        });

    // 3. Crear objeto con la estructura correcta
   const datosVenta = {
    venta: { 
        total: totalNumerico,
        fecha: new Date().toISOString(),

};

    // 4. Enviar
    try {
        const response = await fetch("http://localhost:8080/api/ventas", {
            method: "POST",

            body: JSON.stringify(datosVenta)
        });

        const respuestaTexto = await response.text(); 
        
        if (response.ok) {
            alert("¡Venta guardada!");
            document.getElementById("tablaVentas").innerHTML = "";
            // actualizarTotales(); // Descomenta si tienes esta función
        } else {
            console.error("Error del servidor:", respuestaTexto);
            alert("Error al guardar: " + respuestaTexto);
        }

function imprimirFactura(){
    window.print();
}


window.onload = async () => {
    try {
        const res = await fetch("http://localhost:8080/api/productos");
        const productos = await res.json();
        
        let contenedor = document.querySelector(".row.g-3"); // El contenedor donde van los productos
        contenedor.innerHTML = ""; // Limpiar productos de prueba
        
        productos.forEach(p => {
            contenedor.innerHTML += `
                <div class="col-md-6">
                    <div class="producto-item" onclick="agregarVenta('${p.nombre}', '${p.presentaciones[0].nombre}', ${p.presentaciones[0].precioVenta})">
                        <strong>${p.nombre}</strong>
                        <span class="badge bg-success">Stock: ${p.stockActual}</span>
                    </div>
                </div>
            `;
        });
    } catch (e) {
        console.error("No se pudieron cargar los productos:", e);
    }
};
